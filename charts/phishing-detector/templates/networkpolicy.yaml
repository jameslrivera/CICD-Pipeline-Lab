{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "phishing-detector.fullname" . }}-default-deny
  labels:
    {{- include "phishing-detector.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "phishing-detector.fullname" . }}-allow-dns
  labels:
    {{- include "phishing-detector.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "phishing-detector.fullname" . }}-allow-ingress
  labels:
    {{- include "phishing-detector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "phishing-detector.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.clientNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
