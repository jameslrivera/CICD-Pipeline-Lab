{{- if .Values.serviceAccount.create -}}
{{/*
A dedicated ServiceAccount with no RoleBindings. Given none, the pod silently
uses the namespace "default" account and Kubernetes mounts its JWT into the
container — a credential in the filesystem of an internet-facing process that
never calls the Kubernetes API.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "phishing-detector.serviceAccountName" . }}
  labels:
    {{- include "phishing-detector.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
