
replicaCount: 2

image:
  repository: phishing-detector
  tag: "0.1.0"
  pullPolicy: IfNotPresent

detector:
  threshold: 0.5

service:
  type: ClusterIP
  port: 8000

serviceAccount:
  create: true
  name: ""
  automountToken: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: true
  clientNamespaceSelector:
    detector-client: allowed
  dnsNamespace: kube-system

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5
