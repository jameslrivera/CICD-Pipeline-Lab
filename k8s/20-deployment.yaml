apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishing-detector
  namespace: phishing-detector
  labels:
    app: phishing-detector
spec:
  replicas: 2

  selector:
    matchLabels:
      app: phishing-detector

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: phishing-detector
    spec:
      serviceAccountName: phishing-detector
      automountServiceAccountToken: false

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: phishing-detector
          matchLabelKeys:
            - pod-template-hash

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: phishing-detector
          image: phishing-detector:0.1.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: detector-config
              mountPath: /app/config
              readOnly: true

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: detector-config
          configMap:
            name: detector-config
