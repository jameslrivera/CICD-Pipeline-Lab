# A ConfigMap is a named blob of key/value data living in the cluster, decoupled
# from any image. Each key becomes a file when the ConfigMap is mounted as a
# volume, so the key name here IS the filename the container sees.
#
# The threshold is deliberately 0.30, while the copy baked into the image is
# 0.50. That difference is the proof: if a running pod reports 0.30, it is
# reading this ConfigMap and not the file in its own image layer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: detector-config
  namespace: phishing-detector
data:
  detector.yaml: |
    # Supplied by the ConfigMap, not the image.
    threshold: 0.30
