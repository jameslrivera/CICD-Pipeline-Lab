# Every pod gets a ServiceAccount. Given none, it silently gets the namespace's
# "default" SA and Kubernetes mounts that account's JWT into the container at
# /var/run/secrets/kubernetes.io/serviceaccount/token.
#
# This application never calls the Kubernetes API, so that token is pure
# liability: a credential sitting in the filesystem of an internet-facing
# process, available to anything that achieves code execution. The default SA's
# permissions are minimal, but "minimal" is not "none", and relying on the
# NetworkPolicy to block the API server means one manifest edit stands between
# you and a usable credential.
#
# A dedicated ServiceAccount with no RoleBindings also makes the intent legible:
# this workload is granted nothing, on purpose.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: phishing-detector
  namespace: phishing-detector
# Set here as well as on the pod spec. Belt and braces: the pod-level setting
# wins, but if someone later drops the pod-level field, this still holds.
automountServiceAccountToken: false
